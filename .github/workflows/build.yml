name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test movement policy
        run: |
          mkdir -p build
          swiftc macos/MoverPolicy.swift tests/PolicyTests.swift -o build/policy-tests
          build/policy-tests
      - name: Build native arm64 app and disk image
        run: scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Prepare pinned installer compiler
        shell: pwsh
        run: ./scripts/prepare-windows-tools.ps1
      - name: Build Windows app and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify x64 GUI executable
        shell: pwsh
        run: ./scripts/verify-windows-binary.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
